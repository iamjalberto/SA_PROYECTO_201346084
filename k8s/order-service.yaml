# ============================================
# Order Service - Deployment + Service
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: delivereats
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: us-central1-docker.pkg.dev/usac-sa-201346084/delivereats/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50053
          envFrom:
            - configMapRef:
                name: delivereats-config
            - secretRef:
                name: delivereats-secrets
          env:
            - name: PORT
              value: "50053"
            - name: DB_NAME
              value: "order_db"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: delivereats
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 50053
      targetPort: 50053
      protocol: TCP
  type: ClusterIP
