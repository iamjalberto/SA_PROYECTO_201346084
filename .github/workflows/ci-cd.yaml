# ============================================
# Delivereats CI/CD Pipeline
# Validate → Test → Build+Push → Deploy GKE → Ansible → Smoke
# ============================================
name: Delivereats CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  GKE_CLUSTER: delivereats-gke
  AR_REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/delivereats

jobs:
  # ==========================================
  # JOB 0a: Terraform Validate
  # ==========================================
  terraform-validate:
    name: "🏗️ Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        working-directory: iac/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        working-directory: iac/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: iac/terraform
        run: terraform validate

      - name: Terraform Plan (syntax check)
        working-directory: iac/terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_ssh_pub_key: ${{ secrets.LOADTEST_SSH_PUBKEY }}
          TF_VAR_frontend_image: "${{ env.AR_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/delivereats/frontend:latest"
          TF_VAR_api_gateway_url: "http://placeholder"
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform plan -input=false
        continue-on-error: true

  # ==========================================
  # JOB 0b: Ansible Lint
  # ==========================================
  ansible-lint:
    name: "📋 Ansible Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-lint
        run: pip install ansible-core ansible-lint==24.2.0

      - name: Run ansible-lint
        working-directory: iac/ansible
        run: ansible-lint playbooks/setup-loadtest.yml

  # ==========================================
  # JOB 1: Unit Tests
  # ==========================================
  test:
    name: "🧪 Test Services"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - auth-service
          - restaurant-catalog-service
          - order-service
          - delivery-service
          - notification-service
          - payment-service
          - api-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage --forceExit
        continue-on-error: false

  test-python:
    name: "🐍 Test FX Service"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: fx-service
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: fx-service
        run: pytest tests/ -v --cov=app --cov-report=term-missing
        continue-on-error: false

  # ==========================================
  # JOB 2: Build & Push to Artifact Registry
  # ==========================================
  build-and-push:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    needs: [terraform-validate, ansible-lint, test, test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: auth-service
            context: ./auth-service
          - service: restaurant-catalog-service
            context: ./restaurant-catalog-service
          - service: order-service
            context: ./order-service
          - service: delivery-service
            context: ./delivery-service
          - service: notification-service
            context: ./notification-service
          - service: fx-service
            context: ./fx-service
          - service: payment-service
            context: ./payment-service
          - service: api-gateway
            context: ./api-gateway
          - service: frontend
            context: ./frontend
          - service: frontend-cloudrun
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.cloudrun
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AR_REPO }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=${{ github.run_number }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # JOB 3: Deploy to GKE
  # ==========================================
  deploy:
    name: "🚀 Deploy to GKE"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GCP_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Install nginx ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml || true
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s || true

      - name: Deploy application manifests
        env:
          AR_REPO: ${{ env.AR_REPO }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Sustituir imagen en manifests con la versión del run
          TAG="${{ github.run_number }}"
          for svc in auth-service restaurant-catalog-service order-service delivery-service notification-service fx-service payment-service api-gateway frontend; do
            sed -i "s|image: us-central1-docker.pkg.dev/.*/delivereats/${svc}:.*|image: ${AR_REPO}/${svc}:${TAG}|g" k8s/${svc}.yaml 2>/dev/null || true
          done

          # Namespace y configuración base
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/persistent-volumes.yaml

          # Infraestructura (Redis, RabbitMQ)
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/rabbitmq.yaml
          kubectl rollout status deployment/redis -n delivereats --timeout=180s
          kubectl rollout status deployment/rabbitmq -n delivereats --timeout=180s

          # Microservicios
          kubectl apply -f k8s/auth-service.yaml
          kubectl apply -f k8s/restaurant-catalog-service.yaml
          kubectl apply -f k8s/order-service.yaml
          kubectl apply -f k8s/delivery-service.yaml
          kubectl apply -f k8s/notification-service.yaml
          kubectl apply -f k8s/fx-service.yaml
          kubectl apply -f k8s/payment-service.yaml
          kubectl apply -f k8s/api-gateway.yaml
          kubectl apply -f k8s/frontend.yaml

          # CronJobs
          kubectl apply -f k8s/configmap-order-reject-script.yaml
          kubectl apply -f k8s/cronjob-order-reject.yaml

          # Ingress
          kubectl apply -f k8s/ingress.yaml

          # Esperar rollout de servicios críticos
          for svc in auth-service restaurant-catalog-service order-service api-gateway frontend; do
            kubectl rollout status deployment/${svc} -n delivereats --timeout=300s
          done

      - name: Deploy observability stack (ELK)
        run: |
          kubectl apply -f k8s/elk/00-namespace.yaml
          kubectl apply -f k8s/elk/01-elasticsearch.yaml
          kubectl rollout status statefulset/elasticsearch -n logging --timeout=300s || \
            kubectl rollout status deployment/elasticsearch -n logging --timeout=300s || true
          kubectl apply -f k8s/elk/02-kibana.yaml
          kubectl apply -f k8s/elk/03-fluentd-configmap.yaml
          kubectl apply -f k8s/elk/04-fluentd-daemonset.yaml
          kubectl apply -f k8s/elk/05-kibana-ingress.yaml

      - name: Deploy monitoring stack (Prometheus + Grafana)
        run: |
          kubectl apply -f k8s/monitoring/00-namespace.yaml
          kubectl apply -f k8s/monitoring/01-prometheus-config.yaml
          kubectl apply -f k8s/monitoring/02-prometheus.yaml
          kubectl apply -f k8s/monitoring/03-node-exporter.yaml
          kubectl apply -f k8s/monitoring/04-grafana.yaml
          kubectl apply -f k8s/monitoring/05-monitoring-ingress.yaml

      - name: Verify deployment
        run: |
          echo "=== Pods: delivereats ==="
          kubectl get pods -n delivereats
          echo "=== Pods: logging ==="
          kubectl get pods -n logging
          echo "=== Pods: monitoring ==="
          kubectl get pods -n monitoring
          echo "=== Ingress ==="
          kubectl get ingress -n delivereats
          echo "=== Ingress IP ==="
          kubectl get svc -n ingress-nginx ingress-nginx-controller

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed – rolling back microservices"
          for svc in auth-service restaurant-catalog-service order-service delivery-service notification-service fx-service payment-service api-gateway frontend; do
            kubectl rollout undo deployment/${svc} -n delivereats || true
          done

  # ==========================================
  # JOB 4: Configure Load-Test VM with Ansible
  # ==========================================
  ansible-provision:
    name: "⚙️ Ansible: Provision Load-Test VM"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible==9.4.0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LOADTEST_SSH_KEY }}" > ~/.ssh/loadtest_key
          chmod 600 ~/.ssh/loadtest_key

      - name: Update inventory with real VM IP
        run: |
          sed -i "s/LOAD_TEST_VM_IP/${{ secrets.LOADTEST_VM_IP }}/g" iac/ansible/inventory/hosts.ini
          sed -i "s|ansible_ssh_private_key_file=.*|ansible_ssh_private_key_file=~/.ssh/loadtest_key|g" iac/ansible/inventory/hosts.ini

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i iac/ansible/inventory/hosts.ini \
            iac/ansible/playbooks/setup-loadtest.yml \
            --ssh-extra-args="-o StrictHostKeyChecking=no"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/loadtest_key

  # ==========================================
  # JOB 5: Smoke Tests
  # ==========================================
  smoke-tests:
    name: "🔬 Smoke Tests"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get ingress IP
        id: ingress
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GCP_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}
          # Esperar hasta que el Ingress tenga IP
          for i in $(seq 1 20); do
            IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [[ -n "$IP" ]]; then
              echo "ip=$IP" >> "$GITHUB_OUTPUT"
              echo "Ingress IP: $IP"
              break
            fi
            echo "Waiting for Ingress IP... ($i/20)"
            sleep 15
          done

      - name: Run smoke tests
        run: |
          BASE_URL="http://${{ steps.ingress.outputs.ip }}" bash tests/smoke-test.sh
