---
# ─────────────────────────────────────────────
# Tarea 1: Paquetes base del sistema
# ─────────────────────────────────────────────
- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - curl
      - git
      - unzip
    state: present
    update_cache: false # ya actualizado en pre_tasks

# ─────────────────────────────────────────────
# Tarea 2: Crear directorio de trabajo
# ─────────────────────────────────────────────
- name: Create loadtest directory
  ansible.builtin.file:
    path: "{{ loadtester_locust_dir }}"
    state: directory
    owner: "{{ loadtester_app_user }}"
    group: "{{ loadtester_app_user }}"
    mode: "0755"

# ─────────────────────────────────────────────
# Tarea 3: Crear entorno virtual Python
# ─────────────────────────────────────────────
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ loadtester_locust_dir }}/venv
    creates: "{{ loadtester_locust_dir }}/venv/bin/activate"
  become: true
  become_user: "{{ loadtester_app_user }}"

# ─────────────────────────────────────────────
# Tarea 4: Instalar Locust en el venv
# ─────────────────────────────────────────────
- name: Install Locust via pip
  ansible.builtin.pip:
    name:
      - "locust=={{ loadtester_locust_version }}"
      - requests
      - faker
    virtualenv: "{{ loadtester_locust_dir }}/venv"
    state: present
  become: true
  become_user: "{{ loadtester_app_user }}"

# ─────────────────────────────────────────────
# Tarea 5: Crear symlink global de locust
# ─────────────────────────────────────────────
- name: Create global locust symlink
  ansible.builtin.file:
    src: "{{ loadtester_locust_dir }}/venv/bin/locust"
    dest: /usr/local/bin/locust
    state: link
    force: true

# ─────────────────────────────────────────────
# Tarea 6: Copiar locustfile al servidor
# ─────────────────────────────────────────────
- name: Copy locustfile to VM
  ansible.builtin.copy:
    src: ../../../tests/locustfile.py
    dest: "{{ loadtester_locust_dir }}/locustfile.py"
    owner: "{{ loadtester_app_user }}"
    group: "{{ loadtester_app_user }}"
    mode: "0644"

# ─────────────────────────────────────────────
# Tarea 7: Copiar script de smoke test
# ─────────────────────────────────────────────
- name: Copy smoke test script
  ansible.builtin.copy:
    src: ../../../tests/smoke-test.sh
    dest: "{{ loadtester_locust_dir }}/smoke-test.sh"
    owner: "{{ loadtester_app_user }}"
    group: "{{ loadtester_app_user }}"
    mode: "0755"

# ─────────────────────────────────────────────
# Tarea 8: Crear script de ejecución de Locust
# ─────────────────────────────────────────────
- name: Template locust run script
  ansible.builtin.template:
    src: run-locust.sh.j2
    dest: "{{ loadtester_locust_dir }}/run-locust.sh"
    owner: "{{ loadtester_app_user }}"
    group: "{{ loadtester_app_user }}"
    mode: "0755"
