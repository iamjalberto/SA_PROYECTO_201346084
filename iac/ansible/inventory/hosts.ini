# Inventory for Delivereats load-test VM
# Values auto-populated by Terraform output after provisioning.
# Replace LOAD_TEST_VM_IP with the actual external IP from:
#   terraform output loadtest_vm_external_ip

[loadtest]
loadtest-vm ansible_host=LOAD_TEST_VM_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/delivereats_loadtest

[loadtest:vars]
ansible_python_interpreter=/usr/bin/python3
